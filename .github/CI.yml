name: System integration test

on: 
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]

jobs:
  test-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_PASSWORD=test_pass123" >> .env
          echo "AI_SERVICE_URL=http://backend-python:8000" >> .env

      - name: Start Containers
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for Services
        run: |
          echo "Waiting for nest js and others to be ready .. "
          timeout 60s bash -c 'until curl --silent --fail http://localhost:3000/health; do sleep 5; done'
          echo "System is Up!!"

      - name: Run Smoke test
        run: |
          response=$(curl --write-out "‰{http_code}" --silent --output /dev/null "http://localhost:3000/search?q=titanic")
          if [ "$response" -eq 200 ]; then
            echo "Search Endpoint is working!"
          else
            echo "Search failed with status $response"
            exit 1
          fi

      - name: Dump Docker logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Stop Containers
        run: docker compose -f docker-compose.dev.yml down
    
