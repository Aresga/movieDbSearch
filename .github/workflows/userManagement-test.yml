name: Auth Integration Test

on:
  push:
    branches: ["UserManagement", "frontend"]
  pull_request:
    branches: ["UserManagement", "main", "frontend"]

jobs:
  test-auth-endpoints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Start Containers
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Install HTTPie
        run: |
          pip install httpie
          sleep 60

      - name: Health Check
        run: |
          http --check-status --ignore-stdin --verify=no GET http://localhost:8000/health
          http --check-status --ignore-stdin --verify=no GET https://localhost:3000/health

      # ─── Auth Tests ───────────────────────────────────────────────────────────

      - name: Test User Registration
        run: |
          http --check-status --ignore-stdin --verify=no POST https://localhost:3000/auth/register \
            email="citest@example.com" \
            password="TestPass123!" \
            username="citestuser"

      - name: Test User Login
        run: |
          http --check-status --ignore-stdin --print=b --verify=no POST https://localhost:3000/auth/login \
            email="citest@example.com" \
            password="TestPass123!" > response.json

          TOKEN=$(cat response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['access_token']['access_token'])")
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Test Protected Profile Endpoint
        run: |
          http --check-status --ignore-stdin --verify=no GET https://localhost:3000/auth/profile \
            "Authorization:Bearer ${{ env.TOKEN }}"

      - name: Test Invalid Credentials
        run: |
          http --ignore-stdin --verify=no POST https://localhost:3000/auth/login \
            email="citest@example.com" \
            password="WrongPassword" || echo "✅ Invalid credentials correctly rejected"

      - name: Test Duplicate Registration
        run: |
          http --ignore-stdin --verify=no POST https://localhost:3000/auth/register \
            email="citest@example.com" \
            password="TestPass123!" \
            username="citestuser" || echo "✅ Duplicate registration correctly rejected"

      # ─── Friends Tests ────────────────────────────────────────────────────────

      - name: Register Second User (friend target)
        run: |
          http --check-status --ignore-stdin --verify=no POST https://localhost:3000/auth/register \
            email="cifriend@example.com" \
            password="TestPass123!" \
            username="cifrienduser"

      - name: Get Friend User ID
        run: |
          http --check-status --ignore-stdin --print=b --verify=no POST https://localhost:3000/auth/login \
            email="cifriend@example.com" \
            password="TestPass123!" > friend_response.json

          FRIEND_ID=$(cat friend_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['access_token']['user']['id'])")
          echo "FRIEND_ID=$FRIEND_ID" >> $GITHUB_ENV

      - name: Test Add Friend
        run: |
          http --check-status --ignore-stdin --verify=no POST https://localhost:3000/friends/${{ env.FRIEND_ID }} \
            "Authorization:Bearer ${{ env.TOKEN }}"

      - name: Test Get Friends List (expect 1 friend)
        run: |
          RESPONSE=$(http --check-status --ignore-stdin --print=b --verify=no GET https://localhost:3000/friends \
            "Authorization:Bearer ${{ env.TOKEN }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "cifrienduser" && echo "✅ Friend found in list" || (echo "❌ Friend not in list" && exit 1)

      - name: Test Remove Friend
        run: |
          http --check-status --ignore-stdin --verify=no DELETE https://localhost:3000/friends/${{ env.FRIEND_ID }} \
            "Authorization:Bearer ${{ env.TOKEN }}"

      - name: Test Get Friends List (expect empty)
        run: |
          RESPONSE=$(http --check-status --ignore-stdin --print=b --verify=no GET https://localhost:3000/friends \
            "Authorization:Bearer ${{ env.TOKEN }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -qv "cifrienduser" && echo "✅ Friend list is empty after removal" || (echo "❌ Friend still in list" && exit 1)

      - name: Test Add Friend Without Auth (expect 401)
        run: |
          http --ignore-stdin --verify=no POST https://localhost:3000/friends/${{ env.FRIEND_ID }} \
            || echo "✅ Unauthenticated add friend correctly rejected"

      - name: Test Get Friends Without Auth (expect 401)
        run: |
          http --ignore-stdin --verify=no GET https://localhost:3000/friends \
            || echo "✅ Unauthenticated get friends correctly rejected"

      # ─────────────────────────────────────────────────────────────────────────

      - name: Dump Docker logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Stop Containers
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Auth & Friends Endpoints Test Report"
          description: |
            **Status:** ${{ job.status }}
            **Branch:** ${{ github.ref_name }}
            **Project:** Movie Database - Auth & Friends System
            **Commit:** `${{ github.sha }}`
            **Tests:** Registration, Login, Protected Routes, Add/Remove/List Friends, Auth Guards
          status: ${{ job.status }}
          username: Github Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
