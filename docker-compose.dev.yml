services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: Movie_db
    env_file:
      - .env
    volumes:
      - ./backend-python/init_db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moviedb-network
    
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: Movie_fast_api
    env_file:
      - ./.env
    volumes:
      - ./backend-python:/app
      - ./backend-python/dbCSV:/dbCSV
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 60s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moviedb-network

  mongodb:
    image: mongo:7
    container_name: Movie_mongodb
    command: mongod --quiet
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moviedb-network

  backend-nest:
    container_name: Movie_nest_api
    build: 
      context: ./backend-nest
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./backend-nest:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    networks:
      - moviedb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: Movie_frontend
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-nest
    networks:
      - moviedb-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: Movie_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend-nest
      - backend-python
    networks:
      - moviedb-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: Movie_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - moviedb-network

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
  grafana_data:

networks:
  moviedb-network:
    driver: bridge

  
