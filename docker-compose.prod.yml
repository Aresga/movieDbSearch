services:
  moviedb-nginx:
    build:
      context: ./waf-nginx
      dockerfile: Dockerfile.prod
    container_name: moviedb-nginx
    expose:
      - "8080"
    depends_on:
      frontend:
        condition: service_started
      backend-nest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - moviedb-network
      - meinkraft_minecraft-network   # shared with Meinkraft Nginx
    restart: unless-stopped


# HashiCorp Vault: Centralized secret management
  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    container_name: Movie_vault
    env_file:
      - ./.env
    secrets:
      - initial_secrets
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - moviedb-network
    restart: unless-stopped


# PostgreSQL: Relational database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: Movie_db
    env_file:
      - ./.env
    secrets:
      - postgres_password
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - ./backend-python/init_db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - moviedb-network
    restart: unless-stopped


# FastAPI Backend
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: Movie_fast_api
    env_file:
      - ./.env
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/file/vault_root_token
    volumes:
      - vault_data:/vault/file:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 60s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - moviedb-network
    restart: unless-stopped


# MongoDB: NoSQL database
  mongodb:
    image: mongo:7
    container_name: Movie_mongodb
    command: mongod --quiet
    env_file:
      - ./.env
    secrets:
      - mongo_password
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - moviedb-network
    restart: unless-stopped


# NestJS Backend — compiled, no source mount
  backend-nest:
    container_name: Movie_nest_api
    build:
      context: ./backend-nest
      dockerfile: Dockerfile.prod       # multi-stage, runs compiled JS
    entrypoint: ["/bin/sh", "./docker-entrypoint.prod.sh"]
    env_file:
      - ./.env
    secrets:
      - postgres_password
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/file/vault_root_token
      - NODE_ENV=production
    volumes:
      - vault_data:/vault/file:ro       # vault token only, no source code
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend-python:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - moviedb-network
    restart: unless-stopped


# Frontend — built static files served by Nginx, no dev server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod 
    container_name: Movie_frontend
    env_file:
      - ./.env
    depends_on:
      backend-nest:
        condition: service_healthy
    networks:
      - moviedb-network
    restart: unless-stopped


