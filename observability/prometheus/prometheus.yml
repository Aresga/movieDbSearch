global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend-nest
    scheme: http
    metrics_path: /api/metrics
    static_configs:
      - targets: ['backend-nest:3000']

  - job_name: backend-python
    metrics_path: /metrics
    static_configs:
      - targets: ['backend-python:8000']
