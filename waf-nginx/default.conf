map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoint for Docker (No SSL required)
    location /healthz {
        access_log off;
        modsecurity off;
        return 200 'OK';
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;

    # Health check endpoint for HTTPS (Optional)
    location /healthz {
        access_log off;
        modsecurity off;
        return 200 'OK';
    }

    # Frontend
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend-nest
    location /api/ {
        proxy_pass http://backend-nest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket proxy for Socket.IO ---
    location /socket.io/ {
        proxy_pass http://backend-nest:3000;   # NestJS backend inside Docker network
        proxy_http_version 1.1;                            # Required for WebSocket
        proxy_set_header Upgrade $http_upgrade;            # Upgrade header for WebSocket handshake
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional timeouts
        proxy_read_timeout 86400s;                         # Keep WebSocket alive
        proxy_send_timeout 86400s;
    }
}